[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "island-survival"
version = "2.0.0"
description = "A text-based adventure game where players must survive on an island"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Jake Tantorski", email = "jake.tantorski1@marist.edu"}
]
keywords = ["game", "adventure", "text-based", "survival"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/jaketantorski/CMPT120-Project"
Repository = "https://github.com/jaketantorski/CMPT120-Project"
Issues = "https://github.com/jaketantorski/CMPT120-Project/issues"

[project.scripts]
island-survival = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
